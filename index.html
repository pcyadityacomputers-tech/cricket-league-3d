<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Cricket Arena 3D</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  width:92%;
  max-width:420px;
  padding:12px;
  text-align:center;
  color:white;
  background:rgba(0,0,0,.65);
  border-radius:16px;
  pointer-events:none;
}

#title{
  font-size:21px;
  font-weight:bold;
}

#score{
  margin-top:6px;
  font-size:15px;
}

#message{
  margin-top:6px;
  color:#ffe066;
}

#start{
  position:fixed;
  z-index:20;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  padding:18px 30px;
  border:0;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
}

#controls{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  z-index:15;
  display:flex;
  justify-content:center;
  gap:10px;
}

.shot{
  width:95px;
  height:55px;
  border:2px solid white;
  border-radius:14px;
  background:rgba(0,0,0,.7);
  color:white;
  font-weight:bold;
}

.shot:active{
  transform:scale(.94);
}
</style>
</head>

<body>

<div id="hud">

  <div id="title">
    CRICKET ARENA 3D
  </div>

  <div id="score">
    Runs: <span id="runs">0</span>
    &nbsp; | &nbsp;
    Wickets: <span id="wickets">0</span>
    &nbsp; | &nbsp;
    Balls: <span id="balls">0</span>
  </div>

  <div id="message">
    Press START MATCH
  </div>

</div>

<button id="start">
  START MATCH
</button>

<div id="controls">

  <button class="shot" data-shot="defend">
    DEFEND
  </button>

  <button class="shot" data-shot="drive">
    DRIVE
  </button>

  <button class="shot" data-shot="loft">
    LOFT
  </button>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module" src="./game.js"></script>

</body>
</html>
